
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ad_manager
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ad_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  calculadora-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  ad-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ad_manager
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CALCULADORA_API_URL: http://calculadora-api:8081
    depends_on:
      postgres:
        condition: service_healthy
      calculadora-api:
        condition: service_started

volumes:
  postgres_data:
